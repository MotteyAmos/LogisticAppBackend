 <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Throttle</title>
            <style>
                body {
                margin: 0;
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                color: #333;
                }
                .email-container {
                max-width: 600px;
                margin: 30px auto;
                background-color: #000000;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                color:#f0f0f0
                }
                .header {
                background-color: #17654F;
                color: white;
                padding: 20px;
                text-align: center;
                }
                .logo {
                max-height: 50px;
                }
                .content {
                padding: 30px;
                }
                .content h1 {
                font-size: 22px;
                margin-bottom: 10px;
                }
                .content p {
                font-size: 16px;
                line-height: 1.5;
                }
                .button {
                display: inline-block;
                margin-top: 20px;
                background-color: #4a90e2;
                color: white;
                padding: 12px 24px;
                text-decoration: none;
                border-radius: 4px;
                font-weight: bold;
                }
                .footer {
                background-color: #f0f0f0;
                padding: 15px;
                font-size: 12px;
                text-align: center;
                color: #777;
                }
                .centerText{
                    text-align: center;
                    max-width: 500;
                    background-color: #333;
                    padding: 10px 5px;
                    font-weight:bold
                }
            </style>
        </head>
        <body>

        <div class="email-container">
            <div class="header">
            <h2>Throttle</h2>
            </div>
            <div class="content">
            <h1>Hello, ${userName}</h1>
            <p>
                You recently requested to reset your password. Here is your OTP code:
            </p>
            <p class="centerText">
                ${556}
            </p>
           
            <p style="margin-top: 20px;">
               This code expires in 5 minutes.
            </p>
            </div>
            <div class="footer">
            &copy; 2025 YourApp Inc. All rights reserved.
            </div>
        </div>

        </body>
        </html>
